name: Owner console browser smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install .
      - name: Install the pinned Chromium test driver and browser
        run: |
          npm install --prefix "$RUNNER_TEMP/jx-browser" --no-audit --no-fund --no-save playwright@1.62.1
          "$RUNNER_TEMP/jx-browser/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Run loopback-only browser smoke
        run: NODE_PATH="$RUNNER_TEMP/jx-browser/node_modules" node --test tests/browser/owner_console.smoke.cjs
