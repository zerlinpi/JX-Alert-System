name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,bot]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/ui/*.test.cjs
      - run: npm install --no-save jsdom@24 && node tests/ui/console.smoke.cjs
      - run: ruff check .
      - run: pytest -q
