[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jx-alert-system"
version = "0.1.0"
description = "Lingxing ERP monitoring, anomaly detection, Feishu alerts and MCP server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "cryptography>=43,<46",
  "httpx>=0.27,<1",
  "apscheduler>=3.10,<4",
  "openpyxl>=3.1,<4",
  "mcp>=1.30,<2",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
bot = ["lark-oapi>=1.4,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
