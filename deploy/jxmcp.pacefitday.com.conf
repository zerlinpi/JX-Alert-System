# Dedicated vhost on the existing nginx. No credentials belong in this file.
server {
    listen 80;
    server_name jxmcp.pacefitday.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/jxmcp.pacefitday.com; }
    location / { return 301 https://jxmcp.pacefitday.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name jxmcp.pacefitday.com;
    ssl_certificate /etc/letsencrypt/live/jxmcp.pacefitday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jxmcp.pacefitday.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
