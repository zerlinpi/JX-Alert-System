<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · JX 广告监控台</title>
  <link rel="stylesheet" href="/console/assets/console.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">JX</span>
      <span><strong>JX 广告监控台</strong><small>SparkX 数据 · DeepSeek 分析 · 飞书通知</small></span></div>
    <form method="post" action="/console/login" class="login-form">
      <input type="hidden" name="csrf" value="{{CSRF}}">
      <h1>所有者登录</h1>
      <label for="owner-password">所有者口令</label>
      <input id="owner-password" name="password" type="password" required minlength="16" maxlength="1024"
             autocomplete="current-password">
      <p class="login-error" role="alert">{{ERROR}}</p>
      <button class="button primary" type="submit">登录</button>
    </form>
  </main>
</body>
</html>
