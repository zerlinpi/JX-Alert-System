services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: jxalert
      MARIADB_USER: jxalert
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  mcp:
    build: .
    command: ["python", "-m", "jx_alert.mcp_server", "--transport", "streamable-http"]
    env_file: .env
    restart: unless-stopped
    profiles: ["mcp"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_BIND_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data

  scheduler:
    build: .
    command: ["python", "-m", "jx_alert.scheduler"]
    env_file: .env
    restart: "on-failure:5"
    profiles: ["scheduler"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    command: ["python", "-m", "jx_alert.feishu_bot"]
    env_file: .env
    environment:
      PYTHONPATH: /app/src
    restart: unless-stopped
    profiles: ["bot"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro

volumes:
  db_data:
