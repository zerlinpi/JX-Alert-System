services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: jxalert
      MARIADB_USER: jxalert
      MARIADB_PASSWORD: ${DB_PASSWORD:-jxalert}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  scheduler:
    build: .
    command: ["python", "-m", "jx_alert.scheduler"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
volumes:
  db_data:
